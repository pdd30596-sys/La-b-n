          package vn.compass.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.pm.PackageManager
          import android.hardware.GeomagneticField
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Bundle
          import kotlin.math.abs
          import kotlin.math.acos
          import kotlin.math.asin
          import kotlin.math.sqrt

          class SensorHub(private val ctx: Context) : SensorEventListener, LocationListener {
              private val sm = ctx.getSystemService(Context.SENSOR_SERVICE) as SensorManager
              private val lm = ctx.getSystemService(Context.LOCATION_SERVICE) as LocationManager

              var heading = 0f          // hướng Bắc từ (độ)
              var hasHeading = false
              var tiltX = 0f
              var tiltY = 0f
              var tiltTotal = 0f
              var mag = 0f              // µT
              var accuracy = SensorManager.SENSOR_STATUS_UNRELIABLE
              var location: Location? = null
              var declination = 0f
              var onUpdate: (() -> Unit)? = null

              private val rot = sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR)
              private val acc = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
              private val mg = sm.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD)

              private val gravity = FloatArray(3)
              private val geomag = FloatArray(3)
              private val rm = FloatArray(9)
              private val rm2 = FloatArray(9)
              private val ori = FloatArray(3)
              private var haveGravity = false
              private var last = 0L

              fun hasSensor(): Boolean = (rot != null) || (acc != null && mg != null)

              fun start() {
                  rot?.let { sm.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
                  acc?.let { sm.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
                  mg?.let { sm.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
                  startLocation()
              }

              fun stop() {
                  sm.unregisterListener(this)
                  try {
                      lm.removeUpdates(this)
                  } catch (e: Exception) {
                  }
              }

              @SuppressLint("MissingPermission")
              fun startLocation() {
                  val ok = ctx.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                      ctx.checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  if (!ok) return
                  try {
                      lm.removeUpdates(this)
                  } catch (e: Exception) {
                  }
                  for (p in listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER)) {
                      try {
                          if (lm.isProviderEnabled(p)) {
                              lm.requestLocationUpdates(p, 2000L, 1f, this)
                              lm.getLastKnownLocation(p)?.let { updateLoc(it) }
                          }
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun updateLoc(l: Location) {
                  val cur = location
                  if (cur == null || l.provider == LocationManager.GPS_PROVIDER || l.time - cur.time > 15000L || l.accuracy < cur.accuracy) {
                      location = l
                      declination = GeomagneticField(l.latitude.toFloat(), l.longitude.toFloat(), l.altitude.toFloat(), System.currentTimeMillis()).declination
                  }
              }

              private fun computeHeading(r: FloatArray) {
                  val flat = !haveGravity || abs(gravity[2]) > 6.5f
                  if (flat) {
                      SensorManager.getOrientation(r, ori)
                  } else {
                      SensorManager.remapCoordinateSystem(r, SensorManager.AXIS_X, SensorManager.AXIS_Z, rm2)
                      SensorManager.getOrientation(rm2, ori)
                  }
                  val h = ((Math.toDegrees(ori[0].toDouble()).toFloat()) + 360f) % 360f
                  if (!hasHeading) {
                      heading = h
                      hasHeading = true
                  } else {
                      val delta = ((h - heading + 540f) % 360f) - 180f
                      heading = (heading + delta * 0.25f + 360f) % 360f
                  }
              }

              override fun onSensorChanged(e: SensorEvent) {
                  when (e.sensor.type) {
                      Sensor.TYPE_ACCELEROMETER -> {
                          for (i in 0..2) gravity[i] += (e.values[i] - gravity[i]) * (if (haveGravity) 0.15f else 1f)
                          haveGravity = true
                          val g = 9.81f
                          tiltX = Math.toDegrees(asin((gravity[0] / g).coerceIn(-1f, 1f)).toDouble()).toFloat()
                          tiltY = Math.toDegrees(asin((gravity[1] / g).coerceIn(-1f, 1f)).toDouble()).toFloat()
                          val t = Math.toDegrees(acos((gravity[2] / g).coerceIn(-1f, 1f)).toDouble()).toFloat()
                          tiltTotal = if (t > 90f) 180f - t else t
                      }
                      Sensor.TYPE_MAGNETIC_FIELD -> {
                          mag = sqrt(e.values[0] * e.values[0] + e.values[1] * e.values[1] + e.values[2] * e.values[2])
                          if (rot == null && haveGravity) {
                              System.arraycopy(e.values, 0, geomag, 0, 3)
                              if (SensorManager.getRotationMatrix(rm, null, gravity, geomag)) computeHeading(rm)
                          }
                      }
                      Sensor.TYPE_ROTATION_VECTOR -> {
                          SensorManager.getRotationMatrixFromVector(rm, e.values)
                          computeHeading(rm)
                      }
                  }
                  val now = System.currentTimeMillis()
                  if (now - last > 60L) {
                      last = now
                      onUpdate?.invoke()
                  }
              }

              override fun onAccuracyChanged(s: Sensor, a: Int) {
                  if (s.type == Sensor.TYPE_MAGNETIC_FIELD || s.type == Sensor.TYPE_ROTATION_VECTOR) accuracy = a
              }

              override fun onLocationChanged(l: Location) {
                  updateLoc(l)
              }

              override fun onProviderEnabled(provider: String) {}
              override fun onProviderDisabled(provider: String) {}

              @Deprecated("Deprecated in Java")
              override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) {
              }
          }
