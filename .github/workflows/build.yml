name: Build APK La Ban

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tao ma nguon du an
        run: |
          mkdir -p "$HOME/proj" && cd "$HOME/proj"
          mkdir -p "app"
          cat > "app/build.gradle" <<'AMLICH_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'vn.compass.app'
              compileSdk 34

              defaultConfig {
                  applicationId "vn.compass.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  debug {
                      storeFile rootProject.file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'AMLICH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <uses-feature
                  android:name="android.hardware.sensor.compass"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.location"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/compass/app"
          cat > "app/src/main/java/vn/compass/app/Geo.kt" <<'AMLICH_EOF'
          package vn.compass.app

          import android.content.Context
          import android.content.SharedPreferences
          import android.location.Location
          import java.util.Calendar
          import java.util.Locale
          import java.util.TimeZone
          import kotlin.math.abs
          import kotlin.math.atan
          import kotlin.math.acos
          import kotlin.math.asin
          import kotlin.math.cos
          import kotlin.math.floor
          import kotlin.math.roundToInt
          import kotlin.math.sin
          import kotlin.math.tan

          class Pt(val id: Long, val name: String, val lat: Double, val lon: Double)

          object Points {
              private fun prefs(ctx: Context): SharedPreferences = ctx.getSharedPreferences("compass", Context.MODE_PRIVATE)

              fun all(ctx: Context): MutableList<Pt> {
                  val out = ArrayList<Pt>()
                  for (line in (prefs(ctx).getString("points", "") ?: "").split("\n")) {
                      val p = line.split("\t")
                      if (p.size == 4) {
                          val id = p[0].toLongOrNull() ?: continue
                          val la = p[2].toDoubleOrNull() ?: continue
                          val lo = p[3].toDoubleOrNull() ?: continue
                          out.add(Pt(id, p[1], la, lo))
                      }
                  }
                  return out
              }

              private fun save(ctx: Context, l: List<Pt>) {
                  val s = l.joinToString("\n") { "${it.id}\t${it.name.replace("\t", " ").replace("\n", " ")}\t${it.lat}\t${it.lon}" }
                  prefs(ctx).edit().putString("points", s).apply()
              }

              fun add(ctx: Context, name: String, lat: Double, lon: Double) {
                  val l = all(ctx)
                  l.add(Pt(System.currentTimeMillis(), name, lat, lon))
                  save(ctx, l)
              }

              fun remove(ctx: Context, id: Long) {
                  save(ctx, all(ctx).filter { it.id != id })
                  if (prefs(ctx).getLong("target", -1L) == id) prefs(ctx).edit().putLong("target", -1L).apply()
              }
          }

          object Geo {
              private val dirs = arrayOf("Bắc", "Đông Bắc", "Đông", "Đông Nam", "Nam", "Tây Nam", "Tây", "Tây Bắc")

              fun dirName(h: Float): String = dirs[((h / 45f).roundToInt()) % 8]

              /** [0] = khoảng cách (m), [1] = hướng Bắc thực (độ 0..360) */
              fun distBearing(lat1: Double, lon1: Double, lat2: Double, lon2: Double): FloatArray {
                  val r = FloatArray(2)
                  Location.distanceBetween(lat1, lon1, lat2, lon2, r)
                  r[1] = (r[1] + 360f) % 360f
                  return r
              }

              fun fmtDist(m: Float): String {
                  if (m < 1000f) return "${m.roundToInt()} m"
                  val km = m / 1000f
                  val s = if (km < 100f) String.format(Locale.US, "%.1f", km) else String.format(Locale.US, "%.0f", km)
                  return s.replace('.', ',') + " km"
              }

              fun fmtCoord(v: Double, isLat: Boolean, dms: Boolean): String {
                  val hemi = if (isLat) (if (v >= 0) "B" else "N") else (if (v >= 0) "Đ" else "T")
                  val a = abs(v)
                  if (!dms) return String.format(Locale.US, "%.4f°", a).replace('.', ',') + " " + hemi
                  val d = floor(a).toInt()
                  val mf = (a - d) * 60.0
                  val m = floor(mf).toInt()
                  val s = ((mf - m) * 60.0).roundToInt()
                  return "$d°$m′$s″ $hemi"
              }

              private fun rad(d: Double) = Math.toRadians(d)
              private fun deg(r: Double) = Math.toDegrees(r)
              private fun mod(x: Double, m: Double): Double = ((x % m) + m) % m

              /** Giờ mọc/lặn mặt trời (giờ địa phương), null nếu không có. */
              fun sunTime(lat: Double, lon: Double, rise: Boolean): String? {
                  val cal = Calendar.getInstance()
                  val n = cal.get(Calendar.DAY_OF_YEAR)
                  val lngHour = lon / 15.0
                  val t = n + ((if (rise) 6.0 else 18.0) - lngHour) / 24.0
                  val m = 0.9856 * t - 3.289
                  val l = mod(m + 1.916 * sin(rad(m)) + 0.020 * sin(rad(2 * m)) + 282.634, 360.0)
                  var ra = mod(deg(atan(0.91764 * tan(rad(l)))), 360.0)
                  val lq = floor(l / 90.0) * 90.0
                  val rq = floor(ra / 90.0) * 90.0
                  ra = (ra + (lq - rq)) / 15.0
                  val sinDec = 0.39782 * sin(rad(l))
                  val cosDec = cos(asin(sinDec))
                  val cosH = (cos(rad(90.833)) - sinDec * sin(rad(lat))) / (cosDec * cos(rad(lat)))
                  if (cosH > 1.0 || cosH < -1.0) return null
                  val h = (if (rise) 360.0 - deg(acos(cosH)) else deg(acos(cosH))) / 15.0
                  val tt = h + ra - 0.06571 * t - 6.622
                  val ut = mod(tt - lngHour, 24.0)
                  val off = TimeZone.getDefault().getOffset(System.currentTimeMillis()) / 3600000.0
                  val local = mod(ut + off, 24.0)
                  val hh = floor(local).toInt()
                  val mm = ((local - hh) * 60.0).roundToInt()
                  val h2 = if (mm == 60) (hh + 1) % 24 else hh
                  val m2 = if (mm == 60) 0 else mm
                  return String.format(Locale.US, "%02d:%02d", h2, m2)
              }

              /** Tuổi trăng (ngày) và tên pha. */
              fun moon(): Pair<Double, String> {
                  val synodic = 29.530588853
                  val days = (System.currentTimeMillis() - 947182440000L) / 86400000.0
                  val age = mod(days, synodic)
                  val name = when {
                      age < 1.85 -> "Trăng non"
                      age < 5.54 -> "Trăng lưỡi liềm đầu tháng"
                      age < 9.23 -> "Trăng bán nguyệt đầu tháng"
                      age < 12.92 -> "Trăng khuyết (tăng dần)"
                      age < 16.61 -> "Trăng tròn"
                      age < 20.30 -> "Trăng khuyết (giảm dần)"
                      age < 23.99 -> "Trăng bán nguyệt cuối tháng"
                      age < 27.68 -> "Trăng lưỡi liềm cuối tháng"
                      else -> "Trăng non"
                  }
                  return Pair(age, name)
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/compass/app"
          cat > "app/src/main/java/vn/compass/app/MainActivity.kt" <<'AMLICH_EOF'
          package vn.compass.app

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.hardware.SensorManager
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs
          import kotlin.math.min
          import kotlin.math.roundToInt

          class MainActivity : Activity() {
              private lateinit var hub: SensorHub
              private lateinit var prefs: SharedPreferences
              private lateinit var body: FrameLayout
              private val tabViews = ArrayList<TextView>()
              private val tabNames = arrayOf("La bàn", "Điểm", "Công cụ", "Cài đặt")
              private var tab = 0
              private val ticks = ArrayList<() -> Unit>()
              private var lockAt: Float? = null
              private var wasNorth = false
              private var lastVib = 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = C.BG
                  window.navigationBarColor = C.BG
                  prefs = getSharedPreferences("compass", MODE_PRIVATE)
                  hub = SensorHub(this)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(C.BG)
                  body = FrameLayout(this)
                  root.addView(body, LinearLayout.LayoutParams(-1, 0, 1f))
                  root.addView(buildTabBar(), LinearLayout.LayoutParams(-1, dp(64)))
                  setContentView(root)

                  applyKeepOn()
                  hub.onUpdate = { runTicks() }
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION), 1)
                  }
                  show(0)
              }

              override fun onResume() {
                  super.onResume()
                  hub.start()
                  if (!hub.hasSensor()) Toast.makeText(this, "Máy không có cảm biến la bàn", Toast.LENGTH_LONG).show()
              }

              override fun onPause() {
                  super.onPause()
                  hub.stop()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  hub.startLocation()
              }

              // ---------- tiện ích ----------

              private fun lp(w: Int, h: Int, weight: Float = 0f, l: Int = 0, t: Int = 0, r: Int = 0, b: Int = 0): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(w, h, weight)
                  p.setMargins(dp(l), dp(t), dp(r), dp(b))
                  return p
              }

              private fun column(): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.VERTICAL
                  return c
              }

              private fun row(): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.HORIZONTAL
                  c.gravity = Gravity.CENTER_VERTICAL
                  return c
              }

              private fun card(): LinearLayout {
                  val c = column()
                  c.background = roundBg(this, C.SURFACE, 14, C.LINE)
                  c.setPadding(dp(14), dp(12), dp(14), dp(12))
                  return c
              }

              private fun page(content: LinearLayout): View {
                  content.setPadding(dp(20), dp(24), dp(20), dp(20))
                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  sv.addView(content, ViewGroup.LayoutParams(-1, -2))
                  return sv
              }

              private fun header(c: LinearLayout, title: String, sub: String) {
                  c.addView(tv(this, title, 28f, C.TEXT, true))
                  c.addView(tv(this, sub, 14f, C.MUTED), lp(-1, -2, t = 4, b = 14))
              }

              private fun button(text: String, filled: Boolean, onClick: () -> Unit): TextView {
                  val b = tv(this, text, 15f, if (filled) C.DARKTEXT else C.TEXT, true)
                  b.gravity = Gravity.CENTER
                  b.background = if (filled) roundBg(this, C.AMBER, 14) else roundBg(this, 0, 14, C.LINE2)
                  b.isClickable = true
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun trueMode(): Boolean = prefs.getBoolean("true", true) && hub.location != null
              private fun dispHeading(): Float = if (trueMode()) (hub.heading + hub.declination + 360f) % 360f else hub.heading
              private fun trueHeading(): Float = (hub.heading + (if (hub.location != null) hub.declination else 0f) + 360f) % 360f
              private fun dms() = prefs.getBoolean("dms", false)

              private fun applyKeepOn() {
                  if (prefs.getBoolean("keep", true)) window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  else window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }

              private fun runTicks() {
                  for (t in ArrayList(ticks)) t()
                  checkNorth()
              }

              @Suppress("DEPRECATION")
              private fun checkNorth() {
                  if (!hub.hasHeading) return
                  val h = dispHeading()
                  val near = min(h, 360f - h) < 2f
                  val now = System.currentTimeMillis()
                  if (near && !wasNorth && prefs.getBoolean("vib", true) && now - lastVib > 1500L) {
                      lastVib = now
                      try {
                          (getSystemService(VIBRATOR_SERVICE) as Vibrator).vibrate(VibrationEffect.createOneShot(40, VibrationEffect.DEFAULT_AMPLITUDE))
                      } catch (e: Exception) {
                      }
                  }
                  wasNorth = near
              }

              // ---------- thanh tab ----------

              private fun buildTabBar(): View {
                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.setBackgroundColor(C.BG)
                  for (i in tabNames.indices) {
                      val t = tv(this, tabNames[i], 13f, C.MUTED, true)
                      t.gravity = Gravity.CENTER
                      t.isClickable = true
                      t.setOnClickListener { show(i) }
                      tabViews.add(t)
                      bar.addView(t, LinearLayout.LayoutParams(0, -1, 1f))
                  }
                  val wrap = LinearLayout(this)
                  wrap.orientation = LinearLayout.VERTICAL
                  val line = View(this)
                  line.setBackgroundColor(C.LINE)
                  wrap.addView(line, LinearLayout.LayoutParams(-1, dp(1)))
                  wrap.addView(bar, LinearLayout.LayoutParams(-1, -1))
                  return wrap
              }

              private fun show(t: Int) {
                  tab = t
                  ticks.clear()
                  body.removeAllViews()
                  val v = when (t) {
                      0 -> compassPage()
                      1 -> pointsPage()
                      2 -> toolsPage()
                      else -> settingsPage()
                  }
                  body.addView(v, FrameLayout.LayoutParams(-1, -1))
                  for (i in tabViews.indices) tabViews[i].setTextColor(if (i == t) C.AMBER else C.MUTED)
                  runTicks()
              }

              // ---------- 1. La bàn ----------

              private fun navPoint(): Pt? {
                  val id = prefs.getLong("target", -1L)
                  if (id < 0) return null
                  return Points.all(this).firstOrNull { it.id == id }
              }

              private fun navDialAngle(): Float? {
                  val loc = hub.location ?: return null
                  val p = navPoint() ?: return null
                  val b = Geo.distBearing(loc.latitude, loc.longitude, p.lat, p.lon)[1]
                  return (b - (if (trueMode()) 0f else hub.declination) + 360f) % 360f
              }

              private fun markHere() {
                  val loc = hub.location
                  if (loc == null) {
                      toast("Chưa có vị trí GPS. Hãy ra nơi thoáng và bật định vị.")
                      return
                  }
                  val input = EditText(this)
                  input.setText("Điểm ${Points.all(this).size + 1}")
                  input.setSelectAllOnFocus(true)
                  AlertDialog.Builder(this)
                      .setTitle("Đánh dấu vị trí")
                      .setView(input)
                      .setPositiveButton("Lưu") { _, _ ->
                          val n = input.text.toString().trim().ifEmpty { "Điểm mới" }
                          Points.add(this, n, loc.latitude, loc.longitude)
                          toast("Đã lưu \"$n\"")
                          if (tab == 1) show(1)
                      }
                      .setNegativeButton("Hủy", null)
                      .show()
              }

              private fun compassPage(): View {
                  val col = column()

                  val top = row()
                  val left = column()
                  left.addView(tv(this, "HƯỚNG BẮC", 12f, C.MUTED))
                  val tvNorth = tv(this, "", 16f, C.TEXT, true)
                  left.addView(tvNorth)
                  top.addView(left, lp(0, -2, 1f))
                  val pill = tv(this, "", 13f, C.GREEN, true)
                  pill.setPadding(dp(12), dp(6), dp(12), dp(6))
                  top.addView(pill)
                  col.addView(top)

                  val cv = CompassView(this)
                  val cvp = lp(-2, -2, t = 18)
                  cvp.gravity = Gravity.CENTER_HORIZONTAL
                  col.addView(cv, cvp)

                  val r1 = row()
                  val r2 = row()
                  val mLat = metric("Vĩ độ")
                  val mLon = metric("Kinh độ")
                  val mAlt = metric("Độ cao")
                  val mMag = metric("Từ trường")
                  r1.addView(mLat.first, lp(0, -2, 1f, r = 5))
                  r1.addView(mLon.first, lp(0, -2, 1f, l = 5))
                  r2.addView(mAlt.first, lp(0, -2, 1f, r = 5))
                  r2.addView(mMag.first, lp(0, -2, 1f, l = 5))
                  col.addView(r1, lp(-1, -2, t = 16))
                  col.addView(r2, lp(-1, -2, t = 10))

                  val btns = row()
                  val lockBtn = button("Khóa hướng", false) {}
                  lockBtn.setOnClickListener {
                      lockAt = if (lockAt == null) dispHeading() else null
                  }
                  val markBtn = button("Đánh dấu vị trí", true) { markHere() }
                  btns.addView(lockBtn, lp(0, dp(48), 1f, r = 5))
                  btns.addView(markBtn, lp(0, dp(48), 1f, l = 5))
                  col.addView(btns, lp(-1, -2, t = 14))

                  ticks.add {
                      val h = dispHeading()
                      cv.heading = h
                      cv.centerText = "${h.roundToInt() % 360}°"
                      var sub = Geo.dirName(h)
                      lockAt?.let {
                          val d = ((h - it + 540f) % 360f) - 180f
                          sub += "  (lệch ${if (d >= 0) "+" else ""}${d.roundToInt()}°)"
                      }
                      cv.subText = sub
                      cv.lockAt = lockAt
                      cv.navAt = navDialAngle()
                      cv.invalidate()

                      lockBtn.text = if (lockAt == null) "Khóa hướng" else "Mở khóa hướng"
                      tvNorth.text = if (trueMode()) "Bắc thực" else "Bắc từ"
                      val loc = hub.location
                      if (loc == null) {
                          pill.text = "Chưa có GPS"
                          pill.setTextColor(C.AMBER)
                          pill.background = roundBg(this, Color_amberDim, 20)
                          mLat.second.text = "—"
                          mLon.second.text = "—"
                          mAlt.second.text = "—"
                      } else {
                          pill.text = "GPS ±${loc.accuracy.roundToInt()} m"
                          pill.setTextColor(C.GREEN)
                          pill.background = roundBg(this, Color_greenDim, 20)
                          mLat.second.text = Geo.fmtCoord(loc.latitude, true, dms())
                          mLon.second.text = Geo.fmtCoord(loc.longitude, false, dms())
                          mAlt.second.text = if (loc.hasAltitude()) "${loc.altitude.roundToInt()} m" else "—"
                      }
                      mMag.second.text = "${hub.mag.roundToInt()} µT"
                  }
                  return page(col)
              }

              private val Color_greenDim = android.graphics.Color.parseColor("#10281F")
              private val Color_amberDim = android.graphics.Color.parseColor("#2A200A")

              private fun metric(label: String): Pair<LinearLayout, TextView> {
                  val c = card()
                  c.addView(tv(this, label, 12f, C.MUTED))
                  val v = tv(this, "—", 17f, C.TEXT, true)
                  c.addView(v, lp(-2, -2, t = 4))
                  return Pair(c, v)
              }

              // ---------- 2. Điểm đánh dấu ----------

              private fun pointsPage(): View {
                  val col = column()
                  header(col, "Điểm đánh dấu", "Lưu nơi quan trọng và để la bàn chỉ đường về.")

                  val nav = row()
                  nav.background = roundBg(this, android.graphics.Color.parseColor("#1C1708"), 18, C.AMBER)
                  nav.setPadding(dp(14), dp(14), dp(14), dp(14))
                  val arrow = ArrowView(this)
                  nav.addView(arrow, lp(dp(76), dp(76), r = 14))
                  val navCol = column()
                  navCol.addView(tv(this, "ĐANG DẪN ĐƯỜNG", 12f, C.AMBER, true))
                  val navName = tv(this, "", 22f, C.TEXT, true)
                  navCol.addView(navName)
                  val navInfo = tv(this, "", 14f, C.SUB)
                  navCol.addView(navInfo)
                  nav.addView(navCol, lp(0, -2, 1f))
                  nav.visibility = View.GONE
                  col.addView(nav, lp(-1, -2, b = 12))

                  val listBox = column()
                  col.addView(listBox)

                  val add = button("+  Thêm điểm (vị trí hiện tại)", true) { markHere() }
                  col.addView(add, lp(-1, dp(52), t = 14))

                  class Ref(val p: Pt, val dist: TextView, val bearing: TextView)
                  val refs = ArrayList<Ref>()
                  var hadLoc = false

                  fun fill() {
                      listBox.removeAllViews()
                      refs.clear()
                      val loc = hub.location
                      var pts = Points.all(this)
                      if (loc != null) pts = pts.sortedBy { Geo.distBearing(loc.latitude, loc.longitude, it.lat, it.lon)[0] }.toMutableList()
                      if (pts.isEmpty()) {
                          listBox.addView(tv(this, "Chưa có điểm nào. Bấm \"Thêm điểm\" để lưu vị trí hiện tại.", 14f, C.MUTED), lp(-1, -2, t = 6))
                      }
                      val target = prefs.getLong("target", -1L)
                      for (p in pts) {
                          val r = row()
                          r.background = roundBg(this, C.SURFACE, 14, if (p.id == target) C.AMBER else C.LINE)
                          r.setPadding(dp(12), dp(12), dp(14), dp(12))
                          val ini = tv(this, p.name.take(1).uppercase(), 16f, C.AMBER, true)
                          ini.gravity = Gravity.CENTER
                          ini.background = roundBg(this, android.graphics.Color.parseColor("#1F2833"), 12)
                          r.addView(ini, lp(dp(40), dp(40), r = 12))
                          val mid = column()
                          mid.addView(tv(this, p.name, 16f, C.TEXT, true))
                          mid.addView(tv(this, Geo.fmtCoord(p.lat, true, dms()) + ", " + Geo.fmtCoord(p.lon, false, dms()), 12f, C.MUTED))
                          r.addView(mid, lp(0, -2, 1f))
                          val right = column()
                          right.gravity = Gravity.END
                          val d = tv(this, "—", 15f, C.TEXT, true)
                          val b = tv(this, "", 12f, C.MUTED)
                          right.addView(d)
                          right.addView(b)
                          r.addView(right)
                          r.isClickable = true
                          r.setOnClickListener {
                              prefs.edit().putLong("target", if (prefs.getLong("target", -1L) == p.id) -1L else p.id).apply()
                              fill()
                          }
                          r.setOnLongClickListener {
                              AlertDialog.Builder(this)
                                  .setTitle(p.name)
                                  .setMessage("Xóa điểm này?")
                                  .setPositiveButton("Xóa") { _, _ ->
                                      Points.remove(this, p.id)
                                      fill()
                                  }
                                  .setNegativeButton("Hủy", null)
                                  .show()
                              true
                          }
                          listBox.addView(r, lp(-1, -2, b = 8))
                          refs.add(Ref(p, d, b))
                      }
                      if (pts.isNotEmpty()) {
                          listBox.addView(tv(this, "Chạm để dẫn đường · giữ lâu để xóa", 12f, C.MUTED), lp(-1, -2, t = 2))
                      }
                  }
                  fill()

                  ticks.add {
                      val loc = hub.location
                      if (loc != null && !hadLoc) {
                          hadLoc = true
                          fill()
                      }
                      if (loc != null) {
                          for (r in refs) {
                              val db = Geo.distBearing(loc.latitude, loc.longitude, r.p.lat, r.p.lon)
                              r.dist.text = Geo.fmtDist(db[0])
                              r.bearing.text = "${db[1].roundToInt() % 360}° ${Geo.dirName(db[1])}"
                          }
                      }
                      val t = navPoint()
                      if (t == null) {
                          nav.visibility = View.GONE
                      } else {
                          nav.visibility = View.VISIBLE
                          navName.text = t.name
                          if (loc == null) {
                              navInfo.text = "Đang chờ GPS…"
                          } else {
                              val db = Geo.distBearing(loc.latitude, loc.longitude, t.lat, t.lon)
                              arrow.angle = db[1] - trueHeading()
                              arrow.invalidate()
                              navInfo.text = "Còn ${Geo.fmtDist(db[0])} · hướng ${db[1].roundToInt() % 360}° ${Geo.dirName(db[1])}"
                          }
                      }
                  }
                  return page(col)
              }

              // ---------- 3. Công cụ ----------

              private fun toolsPage(): View {
                  val col = column()
                  header(col, "Công cụ", "Các cảm biến hữu ích khi đi đường.")

                  val lvCard = row()
                  lvCard.background = roundBg(this, C.SURFACE, 18, C.LINE)
                  lvCard.setPadding(dp(16), dp(16), dp(16), dp(16))
                  val level = LevelView(this)
                  lvCard.addView(level, lp(dp(120), dp(120), r = 18))
                  val lvCol = column()
                  lvCol.addView(tv(this, "THƯỚC THỦY", 12f, C.MUTED, true))
                  val lvVal = tv(this, "", 28f, C.TEXT, true)
                  lvCol.addView(lvVal)
                  val lvNote = tv(this, "", 13f, C.GREEN, true)
                  lvCol.addView(lvNote)
                  lvCard.addView(lvCol, lp(0, -2, 1f))
                  col.addView(lvCard)

                  val sun = toolCard("MẶT TRỜI")
                  val moon = toolCard("MẶT TRĂNG")
                  val mag = toolCard("TỪ TRƯỜNG")
                  val tilt = toolCard("ĐỘ NGHIÊNG")
                  val g1 = row()
                  g1.addView(sun.first, lp(0, -2, 1f, r = 5))
                  g1.addView(moon.first, lp(0, -2, 1f, l = 5))
                  val g2 = row()
                  g2.addView(mag.first, lp(0, -2, 1f, r = 5))
                  g2.addView(tilt.first, lp(0, -2, 1f, l = 5))
                  col.addView(g1, lp(-1, -2, t = 12))
                  col.addView(g2, lp(-1, -2, t = 10))

                  val cal = row()
                  cal.background = roundBg(this, android.graphics.Color.parseColor("#10201C"), 16, android.graphics.Color.parseColor("#1F4D3F"))
                  cal.setPadding(dp(16), dp(14), dp(16), dp(14))
                  val calCol = column()
                  calCol.addView(tv(this, "Hiệu chuẩn la bàn", 15f, C.TEXT, true))
                  val calNote = tv(this, "", 13f, android.graphics.Color.parseColor("#A7D8C8"))
                  calCol.addView(calNote)
                  cal.addView(calCol, lp(0, -2, 1f))
                  col.addView(cal, lp(-1, -2, t = 12))

                  ticks.add {
                      level.tiltX = hub.tiltX
                      level.tiltY = hub.tiltY
                      level.invalidate()
                      lvVal.text = String.format(java.util.Locale.US, "%.1f° · %.1f°", abs(hub.tiltX), abs(hub.tiltY)).replace('.', ',')
                      val flat = abs(hub.tiltX) < 1.5f && abs(hub.tiltY) < 1.5f
                      lvNote.text = if (flat) "Gần như phẳng" else "Đang nghiêng"
                      lvNote.setTextColor(if (flat) C.GREEN else C.AMBER)

                      val loc = hub.location
                      if (loc != null) {
                          val rise = Geo.sunTime(loc.latitude, loc.longitude, true)
                          val set = Geo.sunTime(loc.latitude, loc.longitude, false)
                          sun.second.text = rise ?: "—"
                          sun.third.text = if (set != null) "Mọc · lặn lúc $set" else "Không mọc/lặn hôm nay"
                      } else {
                          sun.second.text = "—"
                          sun.third.text = "Cần vị trí GPS"
                      }
                      val m = Geo.moon()
                      moon.second.text = "Ngày " + String.format(java.util.Locale.US, "%.1f", m.first).replace('.', ',')
                      moon.third.text = m.second
                      mag.second.text = "${hub.mag.roundToInt()} µT"
                      mag.third.text = if (hub.mag in 25f..65f) "Bình thường" else "Bất thường (gần nam châm/kim loại?)"
                      tilt.second.text = "${hub.tiltTotal.roundToInt()}°"
                      tilt.third.text = "Góc so với mặt phẳng"

                      val (txt, ok) = when (hub.accuracy) {
                          SensorManager.SENSOR_STATUS_ACCURACY_HIGH -> Pair("Độ chính xác: Cao", true)
                          SensorManager.SENSOR_STATUS_ACCURACY_MEDIUM -> Pair("Độ chính xác: Trung bình", true)
                          SensorManager.SENSOR_STATUS_ACCURACY_LOW -> Pair("Độ chính xác: Thấp. Vẫy máy theo hình số 8.", false)
                          else -> Pair("Chưa tin cậy. Vẫy máy theo hình số 8 để hiệu chuẩn.", false)
                      }
                      calNote.text = txt
                      calNote.setTextColor(if (ok) android.graphics.Color.parseColor("#A7D8C8") else C.AMBER)
                  }
                  return page(col)
              }

              private class Triple3(val first: LinearLayout, val second: TextView, val third: TextView)

              private fun toolCard(label: String): Triple3 {
                  val c = card()
                  c.setPadding(dp(14), dp(14), dp(14), dp(14))
                  c.addView(tv(this, label, 12f, C.MUTED, true))
                  val v = tv(this, "—", 22f, C.TEXT, true)
                  c.addView(v, lp(-2, -2, t = 6))
                  val n = tv(this, "", 13f, C.SUB)
                  c.addView(n, lp(-2, -2, t = 4))
                  return Triple3(c, v, n)
              }

              // ---------- 4. Cài đặt ----------

              private fun segmented(a: String, b: String, firstSelected: Boolean, onPick: (Boolean) -> Unit): LinearLayout {
                  val r = row()
                  r.background = roundBg(this, C.BG, 12, C.LINE)
                  r.setPadding(dp(4), dp(4), dp(4), dp(4))
                  for (i in 0..1) {
                      val sel = (i == 0) == firstSelected
                      val t = tv(this, if (i == 0) a else b, 14f, if (sel) C.DARKTEXT else C.SUB, true)
                      t.gravity = Gravity.CENTER
                      if (sel) t.background = roundBg(this, C.AMBER, 9)
                      t.isClickable = true
                      t.setOnClickListener {
                          onPick(i == 0)
                          show(tab)
                      }
                      r.addView(t, lp(0, dp(40), 1f))
                  }
                  return r
              }

              private fun toggleRow(c: LinearLayout, label: String, key: String, def: Boolean, onChange: () -> Unit) {
                  val r = row()
                  r.setPadding(dp(14), dp(10), dp(14), dp(10))
                  r.addView(tv(this, label, 15f, C.TEXT, true), lp(0, -2, 1f))
                  val sw = Switch(this)
                  sw.isChecked = prefs.getBoolean(key, def)
                  val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
                  sw.trackTintList = ColorStateList(states, intArrayOf(C.AMBER, C.LINE2))
                  sw.thumbTintList = ColorStateList(states, intArrayOf(android.graphics.Color.WHITE, C.TEXT))
                  sw.setOnCheckedChangeListener { _, on ->
                      prefs.edit().putBoolean(key, on).apply()
                      onChange()
                  }
                  r.addView(sw)
                  c.addView(r)
              }

              private fun settingsPage(): View {
                  val col = column()
                  header(col, "Cài đặt", "Tuỳ chỉnh la bàn theo cách bạn dùng.")

                  col.addView(tv(this, "ĐO HƯỚNG", 13f, C.MUTED, true), lp(-1, -2, t = 6, b = 8))
                  val c1 = card()
                  c1.addView(tv(this, "Hướng Bắc", 15f, C.TEXT, true))
                  c1.addView(segmented("Bắc thực", "Bắc từ", prefs.getBoolean("true", true)) { prefs.edit().putBoolean("true", it).apply() }, lp(-1, -2, t = 10))
                  c1.addView(tv(this, "Bắc thực đã bù độ lệch từ trường theo vị trí GPS (cần có GPS).", 13f, C.MUTED), lp(-1, -2, t = 8))
                  col.addView(c1)

                  val c2 = card()
                  c2.addView(tv(this, "Kiểu hiển thị tọa độ", 15f, C.TEXT, true))
                  c2.addView(segmented("21,0285°", "21°1′43″", !prefs.getBoolean("dms", false)) { prefs.edit().putBoolean("dms", !it).apply() }, lp(-1, -2, t = 10))
                  col.addView(c2, lp(-1, -2, t = 10))

                  col.addView(tv(this, "TRẢI NGHIỆM", 13f, C.MUTED, true), lp(-1, -2, t = 20, b = 8))
                  val c3 = card()
                  c3.setPadding(0, dp(4), 0, dp(4))
                  toggleRow(c3, "Rung khi hướng về Bắc", "vib", true) {}
                  toggleRow(c3, "Giữ màn hình luôn sáng", "keep", true) { applyKeepOn() }
                  col.addView(c3)

                  col.addView(tv(this, "La Bàn 1.0 · Cảm biến: ${if (hub.hasSensor()) "có" else "không có"}", 12f, C.MUTED), lp(-1, -2, t = 20))
                  return page(col)
              }
          }
