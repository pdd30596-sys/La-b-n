name: Build APK La Ban

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tao ma nguon du an
        run: |
          mkdir -p "$HOME/proj" && cd "$HOME/proj"
          mkdir -p "app"
          cat > "app/build.gradle" <<'AMLICH_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'vn.compass.app'
              compileSdk 34

              defaultConfig {
                  applicationId "vn.compass.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              signingConfigs {
                  debug {
                      storeFile rootProject.file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'AMLICH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />

              <uses-feature
                  android:name="android.hardware.sensor.compass"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.location"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/compass/app"
          cat > "app/src/main/java/vn/compass/app/Coord.kt" <<'AMLICH_EOF'
          package vn.compass.app

          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.floor
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.math.tan

          enum class CoordFmt(val label: String) {
              DD("Độ thập phân"),
              DDM("Độ + phút thập phân"),
              DMS("Độ phút giây"),
              UTM("UTM"),
              MGRS("MGRS")
          }

          class Utm(val zone: Int, val band: Char, val easting: Double, val northing: Double)

          object Coord {
              private const val BANDS = "CDEFGHJKLMNPQRSTUVWX"

              private fun hemi(v: Double, isLat: Boolean) =
                  if (isLat) (if (v >= 0) "B" else "N") else (if (v >= 0) "Đ" else "T")

              private fun dec(v: Double, n: Int) = String.format(Locale.US, "%." + n + "f", v).replace('.', ',')

              fun toUtm(lat: Double, lon: Double): Utm {
                  val a = 6378137.0
                  val f = 1.0 / 298.257223563
                  val k0 = 0.9996
                  val zone = (floor((lon + 180.0) / 6.0).toInt() + 1).coerceIn(1, 60)
                  val lon0 = Math.toRadians((zone - 1) * 6.0 - 180.0 + 3.0)
                  val phi = Math.toRadians(lat)
                  val lam = Math.toRadians(lon)
                  val e2 = f * (2.0 - f)
                  val ep2 = e2 / (1.0 - e2)
                  val sp = sin(phi)
                  val cp = cos(phi)
                  val n = a / sqrt(1.0 - e2 * sp * sp)
                  val t = tan(phi) * tan(phi)
                  val c = ep2 * cp * cp
                  val aa = cp * (lam - lon0)
                  val e4 = e2 * e2
                  val e6 = e4 * e2
                  val m = a * ((1.0 - e2 / 4.0 - 3.0 * e4 / 64.0 - 5.0 * e6 / 256.0) * phi -
                      (3.0 * e2 / 8.0 + 3.0 * e4 / 32.0 + 45.0 * e6 / 1024.0) * sin(2.0 * phi) +
                      (15.0 * e4 / 256.0 + 45.0 * e6 / 1024.0) * sin(4.0 * phi) -
                      (35.0 * e6 / 3072.0) * sin(6.0 * phi))
                  val a2 = aa * aa
                  val a3 = a2 * aa
                  val a4 = a2 * a2
                  val a5 = a4 * aa
                  val a6 = a4 * a2
                  val easting = k0 * n * (aa + (1.0 - t + c) * a3 / 6.0 +
                      (5.0 - 18.0 * t + t * t + 72.0 * c - 58.0 * ep2) * a5 / 120.0) + 500000.0
                  var northing = k0 * (m + n * tan(phi) * (a2 / 2.0 +
                      (5.0 - t + 9.0 * c + 4.0 * c * c) * a4 / 24.0 +
                      (61.0 - 58.0 * t + t * t + 600.0 * c - 330.0 * ep2) * a6 / 720.0))
                  if (lat < 0) northing += 10000000.0
                  val bi = floor((lat + 80.0) / 8.0).toInt().coerceIn(0, 19)
                  return Utm(zone, BANDS[bi], easting, northing)
              }

              fun mgrs(lat: Double, lon: Double): String {
                  val u = toUtm(lat, lon)
                  val sets = arrayOf("ABCDEFGH", "JKLMNPQR", "STUVWXYZ")
                  val set = (u.zone - 1) % 3
                  val ci = (floor(u.easting / 100000.0).toInt() - 1).coerceIn(0, 7)
                  val rowLetters = "ABCDEFGHJKLMNPQRSTUV"
                  var ri = floor(u.northing / 100000.0).toInt() % 20
                  if (u.zone % 2 == 0) ri = (ri + 5) % 20
                  val e5 = floor(u.easting % 100000.0).toInt()
                  val n5 = floor(u.northing % 100000.0).toInt()
                  return String.format(Locale.US, "%d%c %c%c %05d %05d", u.zone, u.band, sets[set][ci], rowLetters[ri], e5, n5)
              }

              /** Trả về 1 hoặc 2 dòng chữ cho toạ độ theo định dạng. */
              fun lines(lat: Double, lon: Double, f: CoordFmt): List<String> {
                  return when (f) {
                      CoordFmt.DD -> listOf(dec(abs(lat), 5) + "° " + hemi(lat, true), dec(abs(lon), 5) + "° " + hemi(lon, false))
                      CoordFmt.DDM -> listOf(ddm(lat, true), ddm(lon, false))
                      CoordFmt.DMS -> listOf(dms(lat, true), dms(lon, false))
                      CoordFmt.UTM -> {
                          val u = toUtm(lat, lon)
                          listOf("${u.zone}${u.band}", String.format(Locale.US, "%.0f E  %.0f N", u.easting, u.northing))
                      }
                      CoordFmt.MGRS -> listOf(mgrs(lat, lon))
                  }
              }

              fun oneLine(lat: Double, lon: Double, f: CoordFmt): String = lines(lat, lon, f).joinToString(", ")

              private fun ddm(v: Double, isLat: Boolean): String {
                  val a = abs(v)
                  val d = floor(a).toInt()
                  val m = (a - d) * 60.0
                  return "$d° " + dec(m, 3) + "′ " + hemi(v, isLat)
              }

              private fun dms(v: Double, isLat: Boolean): String {
                  val a = abs(v)
                  var d = floor(a).toInt()
                  val mf = (a - d) * 60.0
                  var m = floor(mf).toInt()
                  var s = Math.round((mf - m) * 60.0).toInt()
                  if (s == 60) { s = 0; m += 1 }
                  if (m == 60) { m = 0; d += 1 }
                  return "$d°$m′$s″ " + hemi(v, isLat)
              }

              fun mapsLink(lat: Double, lon: Double): String =
                  "https://www.google.com/maps/search/?api=1&query=" + String.format(Locale.US, "%.6f,%.6f", lat, lon)
          }
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/compass/app"
          cat > "app/src/main/java/vn/compass/app/Explain.kt" <<'AMLICH_EOF'
          package vn.compass.app

          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.roundToInt

          /** Lời giải thích hiện ra khi chạm vào từng thông số. */
          object Explain {
              private fun f1(v: Float) = String.format(Locale.US, "%.1f", v).replace('.', ',')

              fun heading(h: Float, trueMode: Boolean, magH: Float, decl: Float, hasLoc: Boolean): String {
                  val sb = StringBuilder()
                  sb.append("Con số ${h.roundToInt() % 360}° là góc đo từ hướng Bắc, quay theo chiều kim đồng hồ, tới hướng đầu máy đang chỉ.\n")
                  sb.append("• 0° = Bắc, 90° = Đông, 180° = Nam, 270° = Tây.\n\n")
                  sb.append("Vì sao ra số này: cảm biến từ trường đo từ trường Trái Đất, gia tốc kế cho biết máy đang nghiêng thế nào. Máy ghép hai thứ lại để tính hướng Bắc từ, hiện là ${magH.roundToInt() % 360}°.\n\n")
                  if (trueMode) {
                      sb.append("Bạn đang dùng Bắc thực: máy cộng thêm độ lệch từ ${f1(decl)}° tại vị trí GPS của bạn, nên ra ${h.roundToInt() % 360}°. Độ lệch này có vì cực Bắc từ của Trái Đất không trùng cực Bắc địa lý.")
                  } else if (!hasLoc) {
                      sb.append("Đang dùng Bắc từ. Bật GPS để có Bắc thực, khớp với bản đồ hơn.")
                  } else {
                      sb.append("Đang dùng Bắc từ. Muốn khớp với bản đồ hãy chọn Bắc thực trong Cài đặt (độ lệch tại chỗ bạn là ${f1(decl)}°).")
                  }
                  sb.append("\n\nSố nhảy hoặc lệch nhiều thường do kim loại, loa, nam châm hoặc ốp lưng từ tính ở gần máy.")
                  return sb.toString()
              }

              fun north(trueMode: Boolean, decl: Float, hasLoc: Boolean): String {
                  val sb = StringBuilder()
                  sb.append("• Bắc từ: hướng mà kim la bàn chỉ, theo từ trường Trái Đất.\n")
                  sb.append("• Bắc thực: hướng về cực Bắc địa lý, là hướng của các đường kinh tuyến trên bản đồ.\n\n")
                  sb.append("Hai hướng này lệch nhau một góc gọi là độ lệch từ. Góc đó thay đổi theo nơi bạn đứng và theo năm; máy tính từ mô hình từ trường Trái Đất dựa trên vị trí GPS.\n\n")
                  sb.append(if (trueMode) "Hiện bạn dùng Bắc thực, độ lệch tại đây là ${f1(decl)}°."
                  else if (!hasLoc) "Hiện chưa có GPS nên chỉ dùng được Bắc từ."
                  else "Hiện bạn dùng Bắc từ. Độ lệch tại đây là ${f1(decl)}°; chọn Bắc thực trong Cài đặt để bù.")
                  return sb.toString()
              }

              fun gps(acc: Float?, provider: String?): String {
                  if (acc == null) {
                      return "Máy chưa xác định được vị trí.\n\nHãy bật Định vị trong cài đặt máy, cấp quyền vị trí cho app và ra nơi thoáng. Lần đầu có thể mất vài chục giây đến vài phút."
                  }
                  val src = if (provider == "gps") "vệ tinh GPS" else if (provider == "network") "Wi-Fi và trạm di động" else "nguồn định vị của máy"
                  return "±${acc.roundToInt()} m nghĩa là vị trí thật của bạn nhiều khả năng nằm trong vòng tròn bán kính ${acc.roundToInt()} m quanh điểm máy báo (độ tin cậy khoảng 68%).\n\n" +
                      "Hiện máy lấy vị trí từ $src.\n" +
                      "• Ngoài trời thoáng, GPS thường sai vài mét.\n" +
                      "• Định vị bằng Wi-Fi hoặc trạm thường sai vài chục đến hàng trăm mét.\n" +
                      "• Trong nhà, giữa nhà cao tầng hoặc dưới tán cây dày thì sai số tăng lên."
              }

              fun coord(f: CoordFmt, lat: Double, lon: Double, acc: Float?): String {
                  val sb = StringBuilder()
                  val ns = if (lat >= 0) "phía Bắc" else "phía Nam"
                  val ew = if (lon >= 0) "phía Đông" else "phía Tây"
                  sb.append("Vĩ độ ${String.format(Locale.US, "%.5f", abs(lat))}° cho biết bạn cách đường xích đạo bấy nhiêu độ về $ns. ")
                  sb.append("Kinh độ ${String.format(Locale.US, "%.5f", abs(lon))}° cho biết bạn cách kinh tuyến gốc Greenwich bấy nhiêu độ về $ew. Hai số này xác định một điểm duy nhất trên Trái Đất.\n\n")
                  sb.append("Định dạng đang chọn: ${f.label}.\n")
                  when (f) {
                      CoordFmt.DD -> sb.append("Độ thập phân là cách ngắn gọn nhất, các app bản đồ như Google Maps dùng cách này. Chữ B/N là Bắc/Nam, Đ/T là Đông/Tây.")
                      CoordFmt.DDM -> sb.append("Độ + phút thập phân: 1 độ chia 60 phút. Phần lẻ sau dấu phẩy của độ được đổi ra phút. Hay dùng trong hàng hải và hàng không.")
                      CoordFmt.DMS -> sb.append("Độ phút giây là cách cổ điển: 1 độ = 60 phút (′), 1 phút = 60 giây (″). Một giây vĩ độ tương ứng khoảng 30 m trên mặt đất.")
                      CoordFmt.UTM -> {
                          val u = Coord.toUtm(lat, lon)
                          sb.append("UTM chia Trái Đất thành 60 múi, mỗi múi rộng 6° kinh độ. Bạn đang ở múi ${u.zone}, dải vĩ độ ${u.band}. ")
                          sb.append("Số E (easting) là số mét tính sang phải từ đường giữa múi, được cộng thêm 500.000 để luôn dương. ")
                          sb.append("Số N (northing) là số mét tính từ xích đạo lên phía Bắc. Việt Nam nằm trong múi 48 (102°–108°Đ) và múi 49 (108°–114°Đ). Đơn vị là mét nên tiện đo khoảng cách trên bản đồ giấy.")
                      }
                      CoordFmt.MGRS -> {
                          val u = Coord.toUtm(lat, lon)
                          sb.append("MGRS dựa trên UTM: múi ${u.zone}, dải ${u.band}, rồi 2 chữ cái chọn ô lưới vuông 100 km, sau đó là 2 số 5 chữ số cho vị trí trong ô (tính bằng mét). Quân đội và cứu hộ hay dùng vì đọc qua bộ đàm gọn.")
                      }
                  }
                  if (acc != null) sb.append("\n\nSai số hiện tại khoảng ±${acc.roundToInt()} m, nên đừng đọc quá chi tiết các chữ số cuối.")
                  return sb.toString()
              }

              fun altitude(alt: Double?, isMsl: Boolean, hasLoc: Boolean): String {
                  if (!hasLoc || alt == null) return "Độ cao lấy từ GPS nên cần có vị trí. Hãy bật định vị và ra nơi thoáng."
                  val sb = StringBuilder()
                  sb.append("Máy báo ${alt.roundToInt()} m.\n\n")
                  if (isMsl) {
                      sb.append("Đây là độ cao so với mực nước biển trung bình, máy đã quy đổi từ độ cao vệ tinh bằng mô hình trọng trường.\n\n")
                  } else {
                      sb.append("Đây là độ cao so với mặt elipsoid WGS84 mà GPS dùng, không hẳn là mực nước biển; hai giá trị có thể lệch nhau vài chục mét tuỳ nơi.\n\n")
                  }
                  sb.append("Độ cao GPS luôn kém chính xác hơn vị trí ngang, sai số theo chiều đứng thường lớn gấp vài lần. Muốn đo độ cao chính xác hơn cần cảm biến áp suất, và phải chuẩn lại khi thời tiết đổi.")
                  return sb.toString()
              }

              fun magnetic(ut: Float): String {
                  val verdict = if (ut in 25f..65f) "Mức này nằm trong khoảng bình thường, la bàn đáng tin."
                  else "Mức này ngoài khoảng bình thường, có thể có nam châm, loa, kim loại, ốp lưng từ hoặc thiết bị điện gần máy, nên hướng có thể sai."
                  return "Từ trường được đo bằng micro-tesla (µT). Máy đo được ${ut.roundToInt()} µT.\n\n" +
                      "Từ trường Trái Đất ở mặt đất thường khoảng 25–65 µT; ở Việt Nam hay gặp quanh 40–50 µT.\n\n" +
                      verdict + "\n\nLa bàn của máy dựa vào đúng con số này để tìm hướng Bắc, nên nó là chỉ báo nhanh xem có bị nhiễu không."
              }

              fun level(x: Float, y: Float): String {
                  return "Gia tốc kế đo hướng của trọng lực. Khi máy nằm phẳng, trọng lực vuông góc màn hình nên cả hai góc bằng 0°.\n\n" +
                      "• Số thứ nhất (${f1(abs(x))}°) là độ nghiêng trái–phải.\n" +
                      "• Số thứ hai (${f1(abs(y))}°) là độ nghiêng trước–sau.\n\n" +
                      "Bong bóng luôn lăn về phía cao hơn, giống thước thủy thật. Bong bóng chuyển xanh khi cả hai góc dưới 1,5°. Hãy đặt máy nằm phẳng sát bề mặt cần đo, tháo ốp lưng dày nếu có."
              }

              fun tilt(t: Float): String {
                  return "Góc so với mặt phẳng nằm ngang. Máy tính bằng cách so hướng trọng lực với trục vuông góc màn hình: nằm phẳng là 0°, dựng đứng là 90°.\n\nHiện máy nghiêng ${t.roundToInt()}°."
              }

              fun sun(hasLoc: Boolean, rise: String?, set: String?): String {
                  if (!hasLoc) return "Giờ mặt trời mọc và lặn phụ thuộc vào vĩ độ, kinh độ và ngày trong năm, nên cần có vị trí GPS."
                  return "Giờ mọc ${rise ?: "—"}, giờ lặn ${set ?: "—"} (giờ địa phương).\n\n" +
                      "Máy tính bằng công thức thiên văn từ vĩ độ, kinh độ và ngày trong năm. Mặt trời được coi là mọc hoặc lặn khi tâm của nó cách đường chân trời 90,83° (tính cả khúc xạ ánh sáng của khí quyển).\n\n" +
                      "Gần đường xích đạo, giờ mọc lặn ít đổi theo mùa; xa hơn thì đổi nhiều. Thực tế có thể lệch vài phút do địa hình và độ cao."
              }

              fun moon(age: Double, name: String): String {
                  return "Tuổi trăng ${String.format(Locale.US, "%.1f", age).replace('.', ',')} ngày: số ngày kể từ lần trăng non gần nhất. Pha hiện tại: $name.\n\n" +
                      "Một chu kỳ trăng dài trung bình 29,53 ngày. Máy tính từ một mốc trăng non đã biết (ngày 6/1/2000) cộng thêm số chu kỳ trôi qua, nên có thể lệch vài giờ so với lịch thiên văn."
              }

              fun calibration(acc: Int): String {
                  val st = when (acc) {
                      3 -> "Cao"
                      2 -> "Trung bình"
                      1 -> "Thấp"
                      else -> "Chưa tin cậy"
                  }
                  return "Hệ điều hành Android tự đánh giá độ tin cậy của cảm biến từ trường. Hiện là: $st.\n\n" +
                      "Cảm biến bị lệch do từ trường của chính linh kiện trong máy và vật xung quanh. Khi vẫy máy theo hình số 8 theo nhiều hướng, máy thu được nhiều mẫu từ trường và tự tính lại phần lệch để bù.\n\n" +
                      "Mẹo: làm ở nơi xa kim loại, nam châm, loa; tháo ốp lưng từ tính."
              }

              fun navigation(dist: Float?, bearing: Float?, trueH: Float): String {
                  val extra = if (dist != null && bearing != null)
                      "\n\nHiện còn ${Geo.fmtDist(dist)}, điểm đích nằm ở hướng ${bearing.roundToInt() % 360}° (${Geo.dirName(bearing)}), đầu máy đang chỉ ${trueH.roundToInt() % 360}°." else ""
                  return "• Khoảng cách là đường chim bay trên mặt cầu Trái Đất, không phải quãng đường đi thực tế.\n" +
                      "• Hướng là góc từ Bắc thực tới điểm đích.\n" +
