          import kotlin.math.cos
          import kotlin.math.floor
          import kotlin.math.ln
          import kotlin.math.sin
          import kotlin.math.sqrt

          /** Bản đồ OpenStreetMap tự vẽ: kéo, chụm để phóng to, lưu đệm để xem lại khi không có mạng. */
          class MapView(ctx: Context) : View(ctx) {
              var centerLat = 21.0285
              var centerLon = 105.8542
              var zoom = 15f

              var myLat: Double? = null
              var myLon: Double? = null
              var myAcc = 0f
              var myHeading = 0f
              var points: List<Pt> = emptyList()
              var targetId = -1L
              var onTapPoint: ((Pt) -> Unit)? = null
              var onLongPressAt: ((Double, Double) -> Unit)? = null

              private val dens = ctx.resources.displayMetrics.density
              private val mainHandler = Handler(Looper.getMainLooper())
              private val pool = Executors.newFixedThreadPool(3)
              private val tileDir = File(ctx.cacheDir, "tiles")
              private val loading = HashSet<String>()
              private val failed = HashMap<String, Long>()
              private val cache = object : LruCache<String, Bitmap>((Runtime.getRuntime().maxMemory() / 1024 / 8).toInt()) {
                  override fun sizeOf(key: String, value: Bitmap): Int = value.byteCount / 1024
              }
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG)

              private var downX = 0f
              private var downY = 0f
              private var lastX = 0f
              private var lastY = 0f
              private var moved = false
              private var longFired = false
              private val longRun = Runnable {
                  if (!moved) {
                      longFired = true
                      onLongPressAt?.invoke(yToLat(latToY(centerLat) + (downY - height / 2.0)), xToLon(lonToX(centerLon) + (downX - width / 2.0)))
                  }
              }

              private val scaleDet = ScaleGestureDetector(ctx, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                  override fun onScale(detector: ScaleGestureDetector): Boolean {
                      zoom = (zoom + (ln(detector.scaleFactor.toDouble()) / ln(2.0)).toFloat()).coerceIn(3f, 19f)
                      invalidate()
                      return true
                  }
              })

              private fun world(): Double = 256.0 * dens * Math.pow(2.0, zoom.toDouble())
              private fun lonToX(lon: Double) = (lon + 180.0) / 360.0 * world()
              private fun latToY(lat: Double): Double {
                  val s = sin(Math.toRadians(lat)).coerceIn(-0.9999, 0.9999)
                  return (0.5 - ln((1.0 + s) / (1.0 - s)) / (4.0 * PI)) * world()
              }

              private fun xToLon(x: Double) = x / world() * 360.0 - 180.0
              private fun yToLat(y: Double): Double {
                  val n = PI - 2.0 * PI * y / world()
                  return Math.toDegrees(atan(Math.sinh(n)))
              }

              fun zoomBy(d: Float) {
                  zoom = (zoom + d).coerceIn(3f, 19f)
                  invalidate()
              }

              fun centerOn(lat: Double, lon: Double) {
                  centerLat = lat
                  centerLon = lon
                  invalidate()
              }

              fun clearCache() {
                  cache.evictAll()
                  failed.clear()
                  tileDir.deleteRecursively()
                  invalidate()
              }

              // ---------- tải ô bản đồ ----------

              private fun getTile(z: Int, x: Int, y: Int): Bitmap? {
                  val key = "$z/$x/$y"
                  cache.get(key)?.let { return it }
                  val f = failed[key]
                  if (f != null && System.currentTimeMillis() - f < 15000L) return null
                  if (loading.add(key)) {
                      pool.execute {
                          val b = loadTile(z, x, y)
                          mainHandler.post {
                              loading.remove(key)
                              if (b != null) {
                                  cache.put(key, b)
                                  failed.remove(key)
                              } else {
                                  failed[key] = System.currentTimeMillis()
                              }
                              invalidate()
                          }
                      }
                  }
                  return null
              }

              private fun loadTile(z: Int, x: Int, y: Int): Bitmap? {
                  val file = File(tileDir, "$z/$x/$y.png")
                  val fresh = file.exists() && System.currentTimeMillis() - file.lastModified() < 7L * 86400000L
                  if (fresh) {
                      BitmapFactory.decodeFile(file.absolutePath)?.let { return it }
                  }
                  try {
                      val c = URL("https://tile.openstreetmap.org/$z/$x/$y.png").openConnection() as HttpURLConnection
                      c.setRequestProperty("User-Agent", "LaBan/1.0 (Android compass app)")
                      c.connectTimeout = 8000
                      c.readTimeout = 8000
                      if (c.responseCode == 200) {
                          val bytes = c.inputStream.use { it.readBytes() }
                          file.parentFile?.mkdirs()
                          file.writeBytes(bytes)
                          return BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                      }
                  } catch (e: Exception) {
                  }
                  if (file.exists()) return BitmapFactory.decodeFile(file.absolutePath)
                  return null
              }

              // ---------- vẽ ----------

              private fun metersPerPx(lat: Double): Double = 40075016.686 * cos(Math.toRadians(lat)) / world()

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val d = dens
                  c.drawColor(Color.parseColor("#E5E3DF"))
                  val z = floor(zoom.toDouble()).toInt().coerceIn(2, 19)
                  val tilePx = (256.0 * dens * Math.pow(2.0, (zoom - z).toDouble())).toFloat()
                  val cxw = lonToX(centerLon)
                  val cyw = latToY(centerLat)
                  val left = cxw - w / 2.0
                  val top = cyw - h / 2.0
                  val n = 1 shl z
                  val tx0 = floor(left / tilePx).toInt()
                  val tx1 = floor((left + w) / tilePx).toInt()
                  val ty0 = floor(top / tilePx).toInt()
                  val ty1 = floor((top + h) / tilePx).toInt()
                  val dst = RectF()
                  for (ty in ty0..ty1) {
                      if (ty < 0 || ty >= n) continue
                      for (tx in tx0..tx1) {
                          val wx = ((tx % n) + n) % n
                          val bmp = getTile(z, wx, ty)
                          if (bmp != null) {
                              val x = (tx * tilePx - left).toFloat()
                              val y = (ty * tilePx - top).toFloat()
                              dst.set(x, y, x + tilePx + 0.5f, y + tilePx + 0.5f)
                              c.drawBitmap(bmp, null, dst, paint)
                          }
                      }
                  }

                  fun sx(lon: Double) = (w / 2.0 + (lonToX(lon) - cxw)).toFloat()
                  fun sy(lat: Double) = (h / 2.0 + (latToY(lat) - cyw)).toFloat()

                  // đường tới điểm dẫn đường
                  val ml = myLat
                  val mo = myLon
                  val target = points.firstOrNull { it.id == targetId }
                  if (ml != null && mo != null && target != null) {
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = 3 * d
                      paint.color = Color.parseColor("#059669")
                      paint.pathEffect = DashPathEffect(floatArrayOf(14 * d, 10 * d), 0f)
                      val path = Path()
                      path.moveTo(sx(mo), sy(ml))
                      path.lineTo(sx(target.lon), sy(target.lat))
                      c.drawPath(path, paint)
                      paint.pathEffect = null
                  }

                  // điểm đã lưu
                  txt.textSize = 12 * d
                  txt.isFakeBoldText = true
                  for (p in points) {
                      val x = sx(p.lon)
                      val y = sy(p.lat)
                      if (x < -50 || y < -50 || x > w + 50 || y > h + 50) continue
                      paint.style = Paint.Style.FILL
                      paint.color = if (p.id == targetId) Color.parseColor("#059669") else Color.parseColor("#F59E0B")
                      c.drawCircle(x, y, 8 * d, paint)
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = 2 * d
                      paint.color = Color.WHITE
                      c.drawCircle(x, y, 8 * d, paint)
                      txt.style = Paint.Style.STROKE
                      txt.strokeWidth = 3 * d
                      txt.color = Color.WHITE
                      c.drawText(p.name, x + 12 * d, y + 4 * d, txt)
                      txt.style = Paint.Style.FILL
                      txt.color = Color.parseColor("#1F2937")
                      c.drawText(p.name, x + 12 * d, y + 4 * d, txt)
                  }

                  // vị trí của tôi
                  if (ml != null && mo != null) {
                      val x = sx(mo)
                      val y = sy(ml)
                      val accPx = (myAcc / metersPerPx(ml)).toFloat()
                      paint.style = Paint.Style.FILL
                      paint.color = Color.argb(40, 37, 99, 235)
                      c.drawCircle(x, y, accPx.coerceAtLeast(10 * d), paint)
                      c.save()
                      c.rotate(myHeading, x, y)
                      paint.color = Color.argb(150, 37, 99, 235)
                      val cone = Path()
                      cone.moveTo(x, y - 30 * d)
                      cone.lineTo(x - 11 * d, y - 6 * d)
                      cone.lineTo(x + 11 * d, y - 6 * d)
                      cone.close()
                      c.drawPath(cone, paint)
                      c.restore()
                      paint.color = Color.parseColor("#2563EB")
                      c.drawCircle(x, y, 8 * d, paint)
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = 2.5f * d
                      paint.color = Color.WHITE
                      c.drawCircle(x, y, 8 * d, paint)
                  }

                  // thước tỉ lệ + ghi nguồn
                  val mpp = metersPerPx(centerLat)
                  val nice = doubleArrayOf(1.0, 2.0, 5.0, 10.0, 20.0, 50.0, 100.0, 200.0, 500.0, 1000.0, 2000.0, 5000.0, 10000.0, 20000.0, 50000.0, 100000.0, 200000.0, 500000.0, 1000000.0)
                  var len = nice[0]
                  for (v in nice) if (v / mpp <= 120 * d) len = v
                  val barPx = (len / mpp).toFloat()
                  val label = if (len >= 1000) "${(len / 1000).toInt()} km" else "${len.toInt()} m"
                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = 3 * d
                  paint.color = Color.parseColor("#1F2937")
                  c.drawLine(16 * d, h - 16 * d, 16 * d + barPx, h - 16 * d, paint)
                  txt.textSize = 11 * d
                  txt.style = Paint.Style.STROKE
                  txt.strokeWidth = 3 * d
                  txt.color = Color.WHITE
                  c.drawText(label, 16 * d, h - 22 * d, txt)
                  txt.style = Paint.Style.FILL
                  txt.color = Color.parseColor("#1F2937")
                  c.drawText(label, 16 * d, h - 22 * d, txt)

                  val attr = "© OpenStreetMap"
                  txt.textAlign = Paint.Align.RIGHT
                  txt.style = Paint.Style.STROKE
                  txt.strokeWidth = 3 * d
                  txt.color = Color.WHITE
                  c.drawText(attr, w - 8 * d, h - 8 * d, txt)
                  txt.style = Paint.Style.FILL
                  txt.color = Color.parseColor("#374151")
                  c.drawText(attr, w - 8 * d, h - 8 * d, txt)
                  txt.textAlign = Paint.Align.LEFT
              }

              // ---------- chạm ----------

              private fun pan(dx: Float, dy: Float) {
                  val nx = lonToX(centerLon) - dx
                  val ny = latToY(centerLat) - dy
                  centerLon = xToLon(nx)
                  centerLat = yToLat(ny).coerceIn(-84.0, 84.0)
                  invalidate()
              }

              private fun tap(x: Float, y: Float) {
                  val cxw = lonToX(centerLon)
                  val cyw = latToY(centerLat)
                  var best: Pt? = null
                  var bd = 28f * dens
                  for (p in points) {
                      val px = (width / 2.0 + (lonToX(p.lon) - cxw)).toFloat()
                      val py = (height / 2.0 + (latToY(p.lat) - cyw)).toFloat()
                      val dd = sqrt(((px - x) * (px - x) + (py - y) * (py - y)).toDouble()).toFloat()
                      if (dd < bd) {
                          bd = dd
                          best = p
                      }
                  }
                  best?.let { onTapPoint?.invoke(it) }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  scaleDet.onTouchEvent(e)
                  if (e.pointerCount > 1 || scaleDet.isInProgress) {
                      moved = true
                      removeCallbacks(longRun)
                      lastX = e.x
                      lastY = e.y
                      return true
                  }
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          parent?.requestDisallowInterceptTouchEvent(true)
                          downX = e.x
                          downY = e.y
                          lastX = e.x
                          lastY = e.y
                          moved = false
                          longFired = false
                          postDelayed(longRun, 600L)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (!moved && Math.hypot((e.x - downX).toDouble(), (e.y - downY).toDouble()) > 8 * dens) {
                              moved = true
                              removeCallbacks(longRun)
                          }
                          if (moved) pan(e.x - lastX, e.y - lastY)
                          lastX = e.x
                          lastY = e.y
                      }
                      MotionEvent.ACTION_UP -> {
                          removeCallbacks(longRun)
                          if (!moved && !longFired) tap(e.x, e.y)
                      }
                      MotionEvent.ACTION_CANCEL -> removeCallbacks(longRun)
                  }
                  return true
              }
          }
