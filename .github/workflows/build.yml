                  col.addView(cc, lp(-1, -2, t = 14))

                  val r2 = row()
                  val mAlt = metric("Độ cao ⓘ")
                  val mMag = metric("Từ trường ⓘ")
                  mAlt.first.tap("Độ cao") { val (a, msl) = altInfo(); Explain.altitude(a, msl, hub.location != null) }
                  mMag.first.tap("Từ trường") { Explain.magnetic(hub.mag) }
                  r2.addView(mAlt.first, lp(0, -2, 1f, r = 5))
                  r2.addView(mMag.first, lp(0, -2, 1f, l = 5))
                  col.addView(r2, lp(-1, -2, t = 10))

                  val btns = row()
                  val lockBtn = button("Khóa hướng", false) {}
                  lockBtn.setOnClickListener {
                      lockAt = if (lockAt == null) dispHeading() else null
                  }
                  val markBtn = button("Đánh dấu vị trí", true) { markHere() }
                  btns.addView(lockBtn, lp(0, dp(48), 1f, r = 5))
                  btns.addView(markBtn, lp(0, dp(48), 1f, l = 5))
                  col.addView(btns, lp(-1, -2, t = 12))
                  col.addView(tv(this, "Chạm vào từng thông số để xem giải thích.", 12f, C.MUTED), lp(-1, -2, t = 10))

                  ticks.add {
                      val h = dispHeading()
                      cv.skin = prefs.getInt("skin", 0)
                      cv.heading = h
                      cv.centerText = "${h.roundToInt() % 360}°"
                      var sub = Geo.dirName(h)
                      lockAt?.let {
                          val d = ((h - it + 540f) % 360f) - 180f
                          sub += "  (lệch ${if (d >= 0) "+" else ""}${d.roundToInt()}°)"
                      }
                      cv.subText = sub
                      cv.lockAt = lockAt
                      cv.navAt = navDialAngle()
                      cv.invalidate()

                      lockBtn.text = if (lockAt == null) "Khóa hướng" else "Mở khóa hướng"
                      tvNorth.text = if (trueMode()) "Bắc thực" else "Bắc từ"
                      chip.text = fmt().label + " ▾"
                      val loc = hub.location
                      if (loc == null) {
                          pill.text = "Chưa có GPS ⓘ"
                          pill.setTextColor(C.AMBER)
                          pill.background = roundBg(this, C.ACCENTBG, 20)
                          l1.text = "—"
                          l2.text = ""
                      } else {
                          pill.text = "GPS ±${loc.accuracy.roundToInt()} m ⓘ"
                          pill.setTextColor(C.GREEN)
                          pill.background = roundBg(this, C.OKBG, 20)
                          val ls = Coord.lines(loc.latitude, loc.longitude, fmt())
                          l1.text = ls[0]
                          l2.text = ls.getOrNull(1) ?: ""
                      }
                      l2.visibility = if (l2.text.isEmpty()) View.GONE else View.VISIBLE
                      val (alt, _) = altInfo()
                      mAlt.second.text = if (alt != null) "${alt.roundToInt()} m" else "—"
                      mMag.second.text = "${hub.mag.roundToInt()} µT"
                  }
                  return page(col)
              }

              private fun metric(label: String): Pair<LinearLayout, TextView> {
                  val c = card()
                  c.addView(tv(this, label, 12f, C.MUTED))
                  val v = tv(this, "—", 17f, C.TEXT, true)
                  c.addView(v, lp(-2, -2, t = 4))
                  return Pair(c, v)
              }

              // ---------- 2. Bản đồ ----------

              private fun circleBtn(text: String, onClick: () -> Unit): TextView {
                  val t = tv(this, text, 22f, C.TEXT, true)
                  t.gravity = Gravity.CENTER
                  t.background = roundBg(this, C.SURFACE, 24, C.LINE2)
                  t.isClickable = true
                  t.setOnClickListener { onClick() }
                  return t
              }

              private fun mapPageView(): View {
                  val mv: MapView
                  val existing = mapPage
                  if (existing != null && mapView != null) {
                      mv = mapView!!
                      (existing.parent as? ViewGroup)?.removeView(existing)
                  } else {
                      mv = MapView(this)
                      mapView = mv
                      val fl = FrameLayout(this)
                      fl.addView(mv, FrameLayout.LayoutParams(-1, -1))
                      val ctrl = column()
                      ctrl.addView(circleBtn("+") { mv.zoomBy(1f) }, lp(dp(48), dp(48), b = 8))
                      ctrl.addView(circleBtn("−") { mv.zoomBy(-1f) }, lp(dp(48), dp(48), b = 8))
                      ctrl.addView(circleBtn("◎") {
                          val l = hub.location
                          if (l != null) mv.centerOn(l.latitude, l.longitude) else toast("Chưa có vị trí GPS")
                      }, lp(dp(48), dp(48)))
                      val cp = FrameLayout.LayoutParams(-2, -2)
                      cp.gravity = Gravity.END or Gravity.BOTTOM
                      cp.setMargins(0, 0, dp(14), dp(34))
                      fl.addView(ctrl, cp)
                      val info = tv(this, "ⓘ Cách dùng", 12f, C.TEXT, true)
                      info.setPadding(dp(12), dp(8), dp(12), dp(8))
                      info.background = roundBg(this, C.SURFACE, 16, C.LINE2)
                      info.tap("Bản đồ") { Explain.map() }
                      val ip = FrameLayout.LayoutParams(-2, -2)
                      ip.gravity = Gravity.START or Gravity.TOP
                      ip.setMargins(dp(12), dp(14), 0, 0)
                      fl.addView(info, ip)
                      mv.onTapPoint = { p -> pointMenu(p) }
                      mv.onLongPressAt = { la, lo -> askName(la, lo) }
                      mapPage = fl
                  }
                  mv.points = Points.all(this)
                  mv.targetId = prefs.getLong("target", -1L)
                  ticks.add {
                      val loc = hub.location
                      mv.myLat = loc?.latitude
                      mv.myLon = loc?.longitude
                      mv.myAcc = loc?.accuracy ?: 0f
                      mv.myHeading = trueHeading()
                      if (!mapCentered && loc != null) {
                          mapCentered = true
                          mv.centerOn(loc.latitude, loc.longitude)
                      }
                      val now = System.currentTimeMillis()
                      if (now - lastMapInv > 250L) {
                          lastMapInv = now
                          mv.invalidate()
                      }
                  }
                  return mapPage!!
              }

              // ---------- 3. Điểm đánh dấu ----------

              private fun pointsPage(): View {
                  val col = column()
                  header(col, "Điểm đánh dấu", "Lưu nơi quan trọng và để la bàn chỉ đường về.")

                  val nav = row()
                  nav.background = roundBg(this, C.ACCENTBG, 18, C.AMBER)
                  nav.setPadding(dp(14), dp(14), dp(14), dp(14))
                  val arrow = ArrowView(this)
                  nav.addView(arrow, lp(dp(76), dp(76), r = 14))
                  val navCol = column()
                  navCol.addView(tv(this, "ĐANG DẪN ĐƯỜNG ⓘ", 12f, C.AMBER, true))
                  val navName = tv(this, "", 22f, C.TEXT, true)
                  navCol.addView(navName)
                  val navInfo = tv(this, "", 14f, C.SUB)
                  navCol.addView(navInfo)
                  nav.addView(navCol, lp(0, -2, 1f))
                  nav.visibility = View.GONE
                  nav.tap("Khoảng cách và mũi tên") {
                      val loc = hub.location
                      val t = navPoint()
                      if (loc != null && t != null) {
                          val db = Geo.distBearing(loc.latitude, loc.longitude, t.lat, t.lon)
                          Explain.navigation(db[0], db[1], trueHeading())
                      } else Explain.navigation(null, null, trueHeading())
                  }
                  col.addView(nav, lp(-1, -2, b = 12))

                  val listBox = column()
                  col.addView(listBox)

                  val add = button("+  Thêm điểm (vị trí hiện tại)", true) { markHere() }
                  col.addView(add, lp(-1, dp(52), t = 14))

                  class Ref(val p: Pt, val dist: TextView, val bearing: TextView)
                  val refs = ArrayList<Ref>()
                  var hadLoc = false

                  fun fill() {
                      listBox.removeAllViews()
                      refs.clear()
                      val loc = hub.location
                      var pts = Points.all(this)
                      if (loc != null) pts = pts.sortedBy { Geo.distBearing(loc.latitude, loc.longitude, it.lat, it.lon)[0] }.toMutableList()
                      if (pts.isEmpty()) {
                          listBox.addView(tv(this, "Chưa có điểm nào. Bấm \"Thêm điểm\" để lưu vị trí hiện tại, hoặc giữ lâu trên bản đồ.", 14f, C.MUTED), lp(-1, -2, t = 6))
                      }
                      val target = prefs.getLong("target", -1L)
                      for (p in pts) {
                          val r = row()
                          r.background = roundBg(this, C.SURFACE, 14, if (p.id == target) C.AMBER else C.LINE)
                          r.setPadding(dp(12), dp(12), dp(14), dp(12))
                          val ini = tv(this, p.name.take(1).uppercase(), 16f, C.AMBER, true)
                          ini.gravity = Gravity.CENTER
                          ini.background = roundBg(this, C.CHIPBG, 12)
                          r.addView(ini, lp(dp(40), dp(40), r = 12))
                          val mid = column()
                          mid.addView(tv(this, p.name, 16f, C.TEXT, true))
                          mid.addView(tv(this, Coord.oneLine(p.lat, p.lon, fmt()), 12f, C.MUTED))
                          r.addView(mid, lp(0, -2, 1f))
                          val right = column()
                          right.gravity = Gravity.END
                          val d = tv(this, "—", 15f, C.TEXT, true)
                          val b = tv(this, "", 12f, C.MUTED)
                          right.addView(d)
                          right.addView(b)
                          r.addView(right)
                          r.isClickable = true
                          r.setOnClickListener {
                              prefs.edit().putLong("target", if (prefs.getLong("target", -1L) == p.id) -1L else p.id).apply()
                              fill()
                          }
                          r.setOnLongClickListener {
                              pointMenu(p)
                              true
                          }
                          listBox.addView(r, lp(-1, -2, b = 8))
                          refs.add(Ref(p, d, b))
                      }
                      if (pts.isNotEmpty()) {
                          listBox.addView(tv(this, "Chạm để dẫn đường · giữ lâu để xem thêm lựa chọn", 12f, C.MUTED), lp(-1, -2, t = 2))
                      }
                  }
                  fill()

                  ticks.add {
                      val loc = hub.location
                      if (loc != null && !hadLoc) {
                          hadLoc = true
                          fill()
                      }
                      if (loc != null) {
                          for (r in refs) {
                              val db = Geo.distBearing(loc.latitude, loc.longitude, r.p.lat, r.p.lon)
                              r.dist.text = Geo.fmtDist(db[0])
                              r.bearing.text = "${db[1].roundToInt() % 360}° ${Geo.dirName(db[1])}"
                          }
                      }
                      val t = navPoint()
                      if (t == null) {
                          nav.visibility = View.GONE
                      } else {
                          nav.visibility = View.VISIBLE
                          navName.text = t.name
                          if (loc == null) {
                              navInfo.text = "Đang chờ GPS…"
                          } else {
                              val db = Geo.distBearing(loc.latitude, loc.longitude, t.lat, t.lon)
                              arrow.angle = db[1] - trueHeading()
                              arrow.invalidate()
                              navInfo.text = "Còn ${Geo.fmtDist(db[0])} · hướng ${db[1].roundToInt() % 360}° ${Geo.dirName(db[1])}"
                          }
                      }
                  }
                  return page(col)
              }

