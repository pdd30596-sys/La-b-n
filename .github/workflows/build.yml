          package vn.compass.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.View
          import android.widget.TextView
          import kotlin.math.max
          import kotlin.math.min

          object C {
              val BG = Color.parseColor("#0B0F14")
              val SURFACE = Color.parseColor("#151B23")
              val LINE = Color.parseColor("#27303B")
              val LINE2 = Color.parseColor("#3B4757")
              val TEXT = Color.parseColor("#F1F5F9")
              val SUB = Color.parseColor("#CBD5E1")
              val MUTED = Color.parseColor("#94A3B8")
              val AMBER = Color.parseColor("#FBBF24")
              val DARKTEXT = Color.parseColor("#1A1203")
              val RED = Color.parseColor("#F87171")
              val GREEN = Color.parseColor("#34D399")
              val DIAL = Color.parseColor("#121821")
          }

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density + 0.5f).toInt()

          fun roundBg(ctx: Context, color: Int, radiusDp: Int, stroke: Int = 0): GradientDrawable {
              val d = GradientDrawable()
              d.setColor(color)
              d.cornerRadius = ctx.dp(radiusDp).toFloat()
              if (stroke != 0) d.setStroke(ctx.dp(1), stroke)
              return d
          }

          fun tv(ctx: Context, text: String, sp: Float, color: Int, bold: Boolean = false): TextView {
              val t = TextView(ctx)
              t.text = text
              t.textSize = sp
              t.setTextColor(color)
              if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
              return t
          }

          class CompassView(ctx: Context) : View(ctx) {
              var heading = 0f
              var lockAt: Float? = null
              var navAt: Float? = null
              var centerText = "0°"
              var subText = ""

              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val names = mapOf(0 to "N", 90 to "E", 180 to "S", 270 to "W")

              override fun onMeasure(w: Int, h: Int) {
                  val s = min(MeasureSpec.getSize(w), context.dp(330))
                  setMeasuredDimension(s, s)
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val d = context.dp(1).toFloat()
                  val cx = w / 2f
                  val cy = h / 2f + 10 * d
                  val r = min(w / 2f - 2 * d, h / 2f - 10 * d)

                  p.style = Paint.Style.FILL
                  p.color = C.DIAL
                  c.drawCircle(cx, cy, r, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = d
                  p.color = C.LINE
                  c.drawCircle(cx, cy, r, p)

                  c.save()
                  c.rotate(-heading, cx, cy)
                  // vạch chia
                  p.style = Paint.Style.STROKE
                  p.strokeCap = Paint.Cap.ROUND
                  for (a in 0 until 360 step 5) {
                      val major = a % 30 == 0
                      p.color = if (a == 0) C.RED else if (major) C.TEXT else Color.parseColor("#64748B")
                      p.strokeWidth = if (major) 2.2f * d else 1.6f * d
                      val len = if (major) 16 * d else 9 * d
                      c.save()
                      c.rotate(a.toFloat(), cx, cy)
                      c.drawLine(cx, cy - r + 8 * d, cx, cy - r + 8 * d + len, p)
                      c.restore()
                  }
                  // chữ
                  p.style = Paint.Style.FILL
                  p.textAlign = Paint.Align.CENTER
                  for (a in 0 until 360 step 30) {
                      val card = names.containsKey(a)
                      p.typeface = Typeface.DEFAULT_BOLD
                      p.textSize = (if (card) 20 else 12) * d
                      p.color = if (a == 0) C.RED else if (card) C.TEXT else C.MUTED
                      c.save()
                      c.rotate(a.toFloat(), cx, cy)
                      c.drawText(names[a] ?: a.toString(), cx, cy - r + 46 * d + p.textSize * 0.35f, p)
                      c.restore()
                  }
                  // dấu khóa hướng / dẫn đường
                  lockAt?.let {
                      c.save()
                      c.rotate(it, cx, cy)
                      p.color = C.AMBER
                      c.drawCircle(cx, cy - r + 4 * d, 4.5f * d, p)
                      c.restore()
                  }
                  navAt?.let {
                      c.save()
                      c.rotate(it, cx, cy)
                      p.color = C.GREEN
                      c.drawCircle(cx, cy - r + 4 * d, 4.5f * d, p)
                      c.restore()
                  }
                  c.restore()

                  // mũi tên cố định
                  val tri = Path()
                  tri.moveTo(cx - 10 * d, 0f)
                  tri.lineTo(cx + 10 * d, 0f)
                  tri.lineTo(cx, 17 * d)
                  tri.close()
                  p.style = Paint.Style.FILL
                  p.color = C.AMBER
                  c.drawPath(tri, p)

                  // số độ ở giữa
                  p.color = C.TEXT
                  p.typeface = Typeface.DEFAULT_BOLD
                  p.textSize = 58 * d
                  c.drawText(centerText, cx, cy + 12 * d, p)
                  p.color = C.AMBER
                  p.textSize = 16 * d
                  c.drawText(subText, cx, cy + 40 * d, p)
              }
          }

          class LevelView(ctx: Context) : View(ctx) {
              var tiltX = 0f
              var tiltY = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(c: Canvas) {
                  val d = context.dp(1).toFloat()
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = min(width, height) / 2f - 2 * d
                  p.style = Paint.Style.FILL
                  p.color = C.BG
                  c.drawCircle(cx, cy, r, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = d
                  p.color = C.LINE2
                  c.drawCircle(cx, cy, r, p)
                  c.drawCircle(cx, cy, r / 3f, p)
                  p.color = C.LINE
                  c.drawLine(cx, cy - r, cx, cy + r, p)
                  c.drawLine(cx - r, cy, cx + r, cy, p)
                  // bong bóng: lệch về phía cao hơn
                  val maxDeg = 15f
                  var bx = -tiltX / maxDeg
                  var by = tiltY / maxDeg
                  val len = Math.sqrt((bx * bx + by * by).toDouble()).toFloat()
                  if (len > 1f) {
                      bx /= len
                      by /= len
                  }
                  val br = r / 4.2f
                  val px = cx + bx * (r - br)
                  val py = cy + by * (r - br)
                  val flat = max(Math.abs(tiltX), Math.abs(tiltY)) < 1.5f
                  p.style = Paint.Style.FILL
                  p.color = if (flat) C.GREEN else C.AMBER
                  p.alpha = 230
                  c.drawCircle(px, py, br, p)
                  p.alpha = 255
              }
          }

          class ArrowView(ctx: Context) : View(ctx) {
              var angle = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(c: Canvas) {
                  val d = context.dp(1).toFloat()
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = min(width, height) / 2f - 1 * d
                  p.style = Paint.Style.FILL
                  p.color = C.BG
                  c.drawCircle(cx, cy, r, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = d
                  p.color = C.LINE2
                  c.drawCircle(cx, cy, r, p)
                  c.save()
                  c.rotate(angle, cx, cy)
                  p.style = Paint.Style.STROKE
                  p.strokeCap = Paint.Cap.ROUND
                  p.strokeJoin = Paint.Join.ROUND
                  p.strokeWidth = 4 * d
                  p.color = C.AMBER
                  c.drawLine(cx, cy + r * 0.55f, cx, cy - r * 0.55f, p)
                  c.drawLine(cx, cy - r * 0.55f, cx - r * 0.32f, cy - r * 0.2f, p)
                  c.drawLine(cx, cy - r * 0.55f, cx + r * 0.32f, cy - r * 0.2f, p)
                  c.restore()
              }
          }
